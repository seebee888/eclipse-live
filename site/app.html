<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eclipse Live">
<title>Eclipse Live</title>
<!--DATA-->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../assets/favicon.png">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..100,400..800&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,85..100,600..800&display=swap" rel="stylesheet">
<style>
/* White page, black type, the Eclipse mark's purple for emphasis: violet #7047cf (left circle), lilac #b087e7 (right
   circle), lens #402087 (where they overlap). A client's own colors never theme the page. Type is the Eclipse pitch
   deck's: Bricolage Grotesque ExtraBold for names, headings and numbers, Archivo for everything else. Panels are flat
   light grey with no borders; only the bar and the floating cards over the globe are glass. The one big moment is the
   hero's Earth, which lights up whole countries where the viewers are and never stops moving. */
:root {
  --bg: #fff; --s1: #f6f5f9; --s2: #ecebf1;
  --ink: #0e0c15; --ink2: #3d3949; --muted: #6e6a7c; --faint: #b5b1c1;
  --line: rgba(14, 12, 21, .08); --line2: rgba(14, 12, 21, .14);
  --violet: #7047cf; --lilac: #b087e7; --lens: #402087; --mist: #f1eafc; --bar: #d8d1e8;
  --display: 'Bricolage Grotesque', 'Archivo', ui-sans-serif, system-ui, sans-serif;
  --sans: 'Archivo', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --r: 24px; --ease: cubic-bezier(.16, 1, .3, 1); --barh: 64px; --max: 1200px; --gut: 40px;
  --lift: 0 1px 2px rgba(14, 12, 21, .06), 0 16px 36px -14px rgba(14, 12, 21, .2);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; background: var(--bg); }
body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 400 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
button { font: inherit; color: inherit; }
::selection { background: rgba(112, 71, 207, .18); }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 3px; border-radius: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.pi { width: 15px; height: 15px; flex: none; }
.dot { position: relative; width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--violet); }
.dot::after { content: ''; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid var(--violet); opacity: 0; animation: live 2.8s var(--ease) infinite; }
.dot.off { background: var(--faint); }
.dot.off::after { display: none; }
@keyframes live { from { transform: scale(.4); opacity: .8; } to { transform: scale(1.5); opacity: 0; } }
@keyframes ping { from { transform: scale(1); opacity: .9; } to { transform: scale(2.3); opacity: 0; } }

/* ---------- the mark ---------- */
.brand { display: inline-flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: auto; flex: none; }
.brand span, .word { font: 800 18px/1 var(--sans); font-stretch: 88%; letter-spacing: .04em; color: var(--ink); }

/* ---------- sign-in: the mark's two circles slide together into the eclipse ---------- */
#gate { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 40px 20px; }
.gate-in { width: min(380px, 100%); text-align: center; }
.gate-mark { display: block; width: 156px; height: auto; margin: 0 auto 22px; overflow: visible; }
.gate-in .word { font-size: 22px; }
.gate-in h1 { margin: 34px 0 8px; font: 800 32px/1.1 var(--display); letter-spacing: -.035em; }
#gate-form > p { margin: 0 0 26px; color: var(--muted); }
.field { display: flex; gap: 8px; }
.field input { flex: 1; min-width: 0; height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid transparent; background: var(--s1);
  color: var(--ink); font: 500 15px var(--sans); transition: border-color .2s, box-shadow .2s, background-color .2s; }
.field input::placeholder { color: var(--muted); }
.field input:focus { outline: none; background: #fff; border-color: var(--violet); box-shadow: 0 0 0 4px rgba(112, 71, 207, .14); }
.btn { height: 52px; padding: 0 24px; border: 0; border-radius: 14px; cursor: pointer; font: 700 15px var(--sans); white-space: nowrap; color: #fff;
  background: var(--violet); transition: background-color .2s; }
.btn:hover { background: #6038c0; }
.btn:disabled { opacity: .6; cursor: progress; }
.remember { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 16px; color: var(--muted); font-size: 13.5px; cursor: pointer; }
.remember input { margin: 0; accent-color: var(--violet); }
.err { min-height: 20px; margin-top: 10px; color: #c0263f; font-size: 13.5px; }
.lock { display: inline-flex; align-items: center; gap: 7px; margin: 22px 0 0; font-size: 12.5px; color: var(--muted); }
.lock svg { width: 14px; height: 14px; }

/* ---------- the bar: frosted, full width ---------- */
.bar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding-top: env(safe-area-inset-top);
  background: rgba(255, 255, 255, .74); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); transition: box-shadow .3s; }
.bar.scrolled { box-shadow: 0 1px 0 var(--line); }
.bar-in { max-width: calc(var(--max) + 2 * var(--gut)); height: var(--barh); margin: 0 auto; padding: 0 var(--gut); display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px; }
.ttl { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; opacity: 0; transform: translateY(6px); pointer-events: none; transition: opacity .35s, transform .5s var(--ease); }
.bar.past .ttl { opacity: 1; transform: none; }
.ttl b { font: 800 16px/1 var(--display); letter-spacing: -.02em; }
.ttl span { font-size: 13px; color: var(--muted); }
.sync { justify-self: end; display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 10px; border-radius: 99px; background: var(--s1);
  font: 400 13px var(--sans); color: var(--muted); white-space: nowrap; }
.sync svg { width: 20px; height: 20px; transform: rotate(-90deg); }
.sync .trk { fill: none; stroke: var(--s2); stroke-width: 2.5; }
.sync .prg { fill: none; stroke: var(--violet); stroke-width: 2.5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.sync b, .sync time { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sync .sep { width: 1px; height: 14px; background: var(--line2); }
.sync.stale .prg { stroke: var(--faint); }

/* ---------- hero ---------- */
.hero-in { max-width: calc(var(--max) + 2 * var(--gut)); margin: 0 auto; padding: calc(var(--barh) + 64px) var(--gut) 72px; display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 40px; align-items: center; }
.hero.solo .hero-in { grid-template-columns: minmax(0, 1fr); }
.id { min-width: 0; }
.name { margin: 0; font: 800 clamp(48px, 5.2vw, 76px)/.95 var(--display); letter-spacing: -.045em; text-wrap: balance; }
.show { margin: 16px 0 0; font: 500 clamp(19px, 1.7vw, 22px)/1.25 var(--sans); color: var(--ink2); }
.np { display: inline-flex; align-items: center; gap: 14px; max-width: 100%; margin-top: 24px; padding: 8px 20px 8px 8px; border-radius: 20px; background: #fff; box-shadow: var(--lift); }
.np img { width: 112px; aspect-ratio: 16 / 9; flex: none; object-fit: cover; border-radius: 13px; }
.np span { min-width: 0; }
.np b { display: block; font: 800 18px/1.15 var(--display); letter-spacing: -.02em; }
.np small { display: block; margin-top: 3px; font-size: 13px; color: var(--muted); }
.np small strong { font-weight: 700; color: var(--ink); letter-spacing: .02em; }
.facts { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 22px; margin: 22px 0 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); }
.facts li { display: inline-flex; align-items: center; gap: 8px; }
.facts .on { color: var(--ink); font-weight: 600; }
.total { margin-top: 44px; }
.total-n { font: 800 clamp(64px, 6.6vw, 96px)/.9 var(--display); letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.total-l { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 16px 0 0; font: 600 16px var(--sans); color: var(--ink2); }
/* real facts take turns in the chip, one line at a time */
.ticker { display: inline-flex; align-items: flex-start; height: 32px; padding: 0 14px; overflow: hidden; border-radius: 99px; background: var(--mist);
  color: var(--lens); font: 600 13.5px var(--sans); font-variant-numeric: tabular-nums; transition: width .7s var(--ease); }
.tk { display: grid; transition: transform .7s var(--ease); }
.tk > span { justify-self: start; display: flex; align-items: center; gap: 7px; height: 32px; white-space: nowrap; }
.tk svg { width: 13px; height: 13px; flex: none; color: var(--violet); }
.tk i { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--violet); }

/* the Earth */
.stage { position: relative; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) 196px; align-items: center; gap: 20px; }
.stage.art, .stage.flat { grid-template-columns: minmax(0, 1fr); }
.globe { position: relative; width: 100%; max-width: 560px; aspect-ratio: 1; justify-self: center; }
.globe .sphere { position: absolute; inset: 8%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 36% 30%, #fff, #f7f5fc 45%, #ebe6f6);
  box-shadow: inset 0 0 0 1px rgba(112, 71, 207, .1), inset -20px -28px 60px rgba(64, 32, 135, .07), 0 48px 70px -46px rgba(40, 22, 90, .4); }
.globe canvas { position: relative; display: block; width: 100%; height: 100%; cursor: grab; touch-action: pan-y; opacity: 0; transition: opacity 1.2s ease; }
.globe canvas.on { opacity: 1; }
.globe canvas:active { cursor: grabbing; }
.focus { position: absolute; left: 0; top: 0; z-index: 1; width: 0; height: 0; pointer-events: none; opacity: 0; transition: opacity .5s; }
.focus.on { opacity: 1; }
.focus::before { content: ''; position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--lens); box-shadow: 0 0 0 3px #fff; }
.focus::after { content: ''; position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--lens); animation: ping 2.4s var(--ease) infinite; }
.focus .lab { position: absolute; left: 0; bottom: 18px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px;
  border-radius: 99px; background: #fff; box-shadow: var(--lift); white-space: nowrap; font: 600 14px var(--sans); color: var(--ink2); }
.focus .lab b { font: 800 18px/1 var(--display); letter-spacing: -.02em; color: var(--violet); font-variant-numeric: tabular-nums; }
.markets { min-width: 0; }
.markets h2 { margin: 0; font: 800 18px/1.2 var(--display); letter-spacing: -.02em; }
.markets p { margin: 4px 0 12px; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
.mk { list-style: none; margin: 0; padding: 0; display: grid; }
.mk button { width: calc(100% + 16px); display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: baseline; padding: 7px 8px; margin: 0 -8px;
  border: 0; border-radius: 12px; background: none; cursor: pointer; text-align: left; font-size: 13.5px; color: var(--ink2); transition: background-color .2s; }
.mk button:hover:not(:disabled) { background: rgba(14, 12, 21, .04); }
.mk button:disabled { cursor: default; }
.mk b { font: 800 15px/1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
.tr { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--s2); overflow: hidden; }
.tr i { display: block; height: 100%; border-radius: 4px; background: var(--bar); transition: background-color .3s; }
.mk [aria-pressed=true] { color: var(--ink); }
.mk [aria-pressed=true] .tr i { background: var(--violet); }
.mk .rest { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 7px 0 2px; font-size: 13.5px; color: var(--muted); }
.mk .rest b { color: var(--ink2); }
.mk .rest .tr i { background: var(--s2); }
/* the map didn't load: the list stands on its own */
.stage.flat .markets { max-width: 420px; }
/* without audience data the key art takes the stage */
.poster { margin: 0; width: 100%; }
.poster img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 26px; box-shadow: 0 30px 60px -34px rgba(14, 12, 21, .45); }
.poster figcaption { padding: 14px 4px 0; font-size: 13.5px; color: var(--muted); }
.poster figcaption strong { font-weight: 700; color: var(--ink); letter-spacing: .02em; }

/* ---------- page ---------- */
.wrap { max-width: calc(var(--max) + 2 * var(--gut)); margin: 0 auto; padding: 0 var(--gut) 56px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.stat { display: flex; flex-direction: column; min-width: 0; padding: 22px; border-radius: var(--r); background: var(--s1); }
.stat h3 { margin: 0; display: flex; align-items: center; gap: 6px; font: 600 13.5px/1.3 var(--sans); color: var(--ink2); }
.stat .v { margin: 12px 0 6px; font: 800 clamp(30px, 2.8vw, 40px)/1 var(--display); letter-spacing: -.035em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat .v small { margin-left: 4px; font: 600 .42em var(--sans); letter-spacing: 0; color: var(--muted); }
.stat .s { margin: 0; font-size: 13px; line-height: 1.45; color: var(--muted); }
.stat .s .up { display: flex; align-items: center; gap: 5px; margin-top: 3px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.stat .s .up svg { width: 12px; height: 12px; color: var(--violet); }
.stat .z { margin-top: auto; padding-top: 18px; }
.stat .z svg { display: block; width: 100%; }
.info { display: inline-grid; place-items: center; color: var(--faint); cursor: help; transition: color .2s; }
.info:hover, .info:focus-visible { color: var(--muted); }
.info svg { width: 14px; height: 14px; }
.meter { height: 6px; border-radius: 6px; background: var(--s2); overflow: hidden; }
.meter i { position: relative; display: block; height: 100%; overflow: hidden; border-radius: 6px; background: var(--violet); transform-origin: left; }
.meter.live i::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent); transform: translateX(-100%); }
.stack { display: flex; gap: 2px; height: 6px; }
.stack i { height: 100%; border-radius: 2px; transform-origin: left; }
.stack i:first-child { border-radius: 6px 2px 2px 6px; }
.stack i:last-child { border-radius: 2px 6px 6px 2px; }
.stack i:only-child { border-radius: 6px; }
.keys { display: grid; gap: 4px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.keys span { display: flex; align-items: center; gap: 7px; }
.keys i { width: 7px; height: 7px; flex: none; border-radius: 2px; }
.keys b { margin-left: auto; font-weight: 600; color: var(--ink2); font-variant-numeric: tabular-nums; }
/* the newest clips slide past (the list runs twice, so the loop has no seam) */
.strip { overflow: hidden; -webkit-mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.strip-in { display: flex; width: max-content; }
.strip i { width: 34px; aspect-ratio: 9 / 16; flex: none; margin-right: 6px; border-radius: 7px; background: var(--s2) center / cover no-repeat; }

.sec { margin-top: 88px; min-width: 0; }
.sh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; margin-bottom: 22px; }
.sh h2 { margin: 0; font: 800 30px/1.1 var(--display); letter-spacing: -.035em; }
.ph h2 { margin: 0; font: 800 21px/1.15 var(--display); letter-spacing: -.025em; }
.note { margin: 4px 0 0; font-size: 14px; color: var(--muted); }
.board { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.c4 { grid-column: span 4; } .c5 { grid-column: span 5; } .c7 { grid-column: span 7; } .c8 { grid-column: span 8; } .c12 { grid-column: 1 / -1; }
.panel { position: relative; min-width: 0; border-radius: var(--r); background: var(--s1); }
.ph { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px 16px; flex-wrap: wrap; padding: 24px 24px 0; }
.seg { display: inline-flex; padding: 3px; border-radius: 99px; background: var(--s2); }
.seg button { border: 0; background: none; padding: 7px 15px; border-radius: 99px; font: 600 13px var(--sans); color: var(--muted); cursor: pointer; transition: color .2s, background-color .2s, box-shadow .2s; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed=true] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(14, 12, 21, .12); }
.navs { display: inline-flex; gap: 8px; }
.navs button { width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: var(--ink); background: var(--s1); transition: background-color .2s, opacity .2s; }
.navs button:hover:not(:disabled) { background: var(--s2); }
.navs button:disabled { opacity: .35; cursor: default; }
.headline { margin: 0; padding: 18px 24px 0; font-size: 15px; line-height: 1.45; color: var(--ink2); }
.headline b { margin-right: 8px; font: 800 42px/1 var(--display); letter-spacing: -.035em; color: var(--ink); vertical-align: -5px; font-variant-numeric: tabular-nums; }
.tip { position: absolute; z-index: 3; pointer-events: none; transform: translate(-50%, calc(-100% - 14px)); padding: 9px 14px; border-radius: 14px; background: var(--ink);
  box-shadow: 0 12px 28px -10px rgba(14, 12, 21, .45); white-space: nowrap; opacity: 0; transition: opacity .12s; font-size: 12px; color: rgba(255, 255, 255, .7); }
.tip b { display: block; margin: 2px 0; font: 800 20px/1.15 var(--display); letter-spacing: -.025em; color: #fff; font-variant-numeric: tabular-nums; }

/* chart */
.chart { position: relative; height: 320px; margin: 14px 16px 12px; touch-action: pan-y; }
.chart svg { width: 100%; height: 100%; overflow: visible; display: block; }
.chart .grid line { stroke: rgba(14, 12, 21, .07); }
.chart .axis text { fill: var(--muted); font: 500 11px var(--sans); font-variant-numeric: tabular-nums; }
.chart .ms text { fill: var(--ink2); font: 600 11px var(--sans); }
.chart .bars path { transition: opacity .15s; }
.chart .ping { transform-box: fill-box; transform-origin: center; }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s var(--ease) .15s forwards; }
.fadein { opacity: 0; animation: fadein 1.1s ease .6s forwards; }
.fadein.late { animation-delay: 1.5s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fadein { to { opacity: 1; } }

/* milestones */
.nx { padding: 22px 24px 0; }
.nx-l { margin: 0; font-size: 13px; color: var(--muted); }
.nx-r { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 4px 0 14px; }
.nx-v { font: 800 44px/1 var(--display); letter-spacing: -.035em; font-variant-numeric: tabular-nums; }
.nx-p { font-size: 13.5px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.nx-p b { font-weight: 700; color: var(--violet); }
.nx .meter { height: 8px; }
.nx-x { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.nx-s { margin: 14px 0 0; font-size: 13.5px; line-height: 1.5; color: var(--ink2); }
.nx-s b { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.tl { list-style: none; margin: 18px 24px 22px; padding: 0; display: grid; }
.tl li { display: grid; grid-template-columns: 16px 50px minmax(0, 1fr) auto; align-items: baseline; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.tl li::before { content: ''; align-self: center; width: 7px; height: 7px; margin-left: 2px; border-radius: 50%; background: var(--faint); }
.tl li:first-child::before { background: var(--violet); }
.tl li b { font: 800 18px/1 var(--display); letter-spacing: -.02em; color: var(--ink); }
.tl li span:last-child { color: var(--muted); }
.tl li.gap { border-top-style: dashed; }

/* reactions */
.spec { display: flex; gap: 2px; height: 12px; margin: 18px 24px; }
.spec i { height: 100%; border-radius: 3px; }
.spec i:first-child { border-radius: 6px 3px 3px 6px; }
.spec i:last-child { border-radius: 3px 6px 6px 3px; }
.rx { list-style: none; margin: 0; padding: 0 24px 24px; display: grid; grid-template-columns: 1fr; gap: 12px 28px; }
.rx li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; color: var(--ink2); }
.rx li i { width: 10px; height: 10px; border-radius: 3px; }
.rx li b { font: 800 16px/1 var(--display); letter-spacing: -.02em; color: var(--ink); font-variant-numeric: tabular-nums; }
.rxp.wide .rx-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: center; gap: 0 12px; padding-bottom: 4px; }

/* ---------- motion: the page opens with the Earth swinging round while the numbers count up, the line draws in and the
   bars rise; after that, the live parts keep moving. Everything holds still for reduced motion. ---------- */
@media (prefers-reduced-motion: no-preference) {

  .chart .ping { animation: ping 2.4s var(--ease) infinite; }
  .pst img { animation: drift 18s ease-in-out infinite alternate; animation-delay: calc(var(--k, 0) * -3.6s); }

@keyframes gl { from { transform: translateX(-26px); opacity: 0; } }
@keyframes gr { from { transform: translateX(26px); opacity: 0; } }
@keyframes gp { from { opacity: 0; transform: scale(.4); } }
@keyframes rise { from { transform: scaleY(0); } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes breathe { from { opacity: .45; } }
@keyframes sheen { 55%, 100% { transform: translateX(100%); } }
@keyframes strip { to { transform: translateX(-50%); } }
@keyframes drift { to { transform: scale(1.06) translateY(-1.5%); } }
@media (prefers-reduced-motion: reduce) {

  .fadein { opacity: 1; }

}

document.addEventListener('error', e => {
  const img = e.target;
  if (img.tagName !== 'IMG' || !img.closest('#app')) return;

// ---------- crypto: the box format written by src/crypto.mjs ----------
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
async function deriveKey(password, kdf) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(kdf.salt), iterations: kdf.iter },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function openBox(key, box) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(box.iv) }, key, unb64(box.ct));
  const text = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}
// The key art is sealed like the numbers (the picture alone would say whose dashboard this is). It doesn't change,
// so it opens once per visit, into a blob: URL the page can reuse on every render.
async function fetchArt(key) {
  const r = await fetch(DATA.replace(/\.json$/, '.art.json'));
  if (!r.ok) throw new Error('art ' + r.status);
  const { src } = await openBox(key, await r.json());
  return URL.createObjectURL(await (await fetch(src)).blob());
}
async function fetchBox() {
  const r = await fetch(`${DATA}?v=${Date.now()}`, { cache: 'no-store' });
  if (!r.ok) throw new Error('data ' + r.status);
  return r.json();
}
const store = {
  get: () => { try { return localStorage.getItem(KEY_SLOT) || sessionStorage.getItem(KEY_SLOT); } catch { return null; } },
  set: (v, keep) => { try { (keep ? localStorage : sessionStorage).setItem(KEY_SLOT, v); } catch {} },
  clear: () => { try { localStorage.removeItem(KEY_SLOT); sessionStorage.removeItem(KEY_SLOT); } catch {} },
};

// ---------- small visuals ----------
// Light bars, with the newest (the hour or day still running) in violet; when it's live it breathes.
function sparkBars(vals, h = 32, live = false) {
  const n = vals.length, max = Math.max(...vals, 1), w = 4;
  const bars = vals.map((v, i) => {
    const bh = Math.max(1.5, (h - 1) * v / max), now = i === n - 1;
    return `<rect${now && live ? ' class="now"' : ''} x="${i * w}" y="${h - bh}" width="${w - 1.2}" height="${bh}" rx=".9" fill="var(${now ? '--violet' : '--bar'})" style="--i:${i}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${n * w} ${h}" height="${h}" preserveAspectRatio="none" aria-hidden="true">${bars}</svg>`;
}
function sparkLine(vals) {
  if (vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), W = 100, H = 22;
  const pts = vals.map((v, i) => [W * i / (vals.length - 1), H - 2 - (H - 4) * (max > min ? (v - min) / (max - min) : .5)]);
  return `<svg class="sl" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${smooth(pts)}" fill="none" stroke="var(--violet)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`;
}
const meter = (f, live) => `<div class="meter${live ? ' live' : ''}" aria-hidden="true"><i style="width:${(100 * Math.max(0, Math.min(1, f))).toFixed(1)}%"></i></div>`;
// Monotone cubic through the points (no overshoot, so the line never dips below a real value).
function smooth(pts) {
  const n = pts.length;
  if (n < 3) return 'M' + pts.map(p => p.map(v => v.toFixed(1)).join(',')).join('L');
  const dx = [], m = [], t = [];
  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / (dx[i] || 1); }
  t[0] = m[0]; t[n - 1] = m[n - 2];
  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;
  for (let i = 0; i < n - 1; i++) {
    if (m[i] === 0) { t[i] = t[i + 1] = 0; continue; }
    const a = t[i] / m[i], b = t[i + 1] / m[i], s = a * a + b * b;
    if (s > 9) { const k = 3 / Math.sqrt(s); t[i] = k * a * m[i]; t[i + 1] = k * b * m[i]; }
  }
  let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < n - 1; i++) {
    const h = dx[i] / 3;
    d += `C${(pts[i][0] + h).toFixed(1)},${(pts[i][1] + h * t[i]).toFixed(1)} ${(pts[i + 1][0] - h).toFixed(1)},${(pts[i + 1][1] - h * t[i + 1]).toFixed(1)} ${pts[i + 1][0].toFixed(1)},${pts[i + 1][1].toFixed(1)}`;
  }
  return d;
}
// the newest clips, sliding past on a loop (the list runs twice so the loop has no seam)
function strip(L) {
  if (!L || L.length < 4) return '';
  const cells = L.map(x => { const th = safeUrl(x.th); return `<i${th ? ` style="background-image:url(&quot;${esc(th)}&quot;)"` : ''}></i>`; }).join('');
  return `<div class="strip" aria-hidden="true"><div class="strip-in">${cells}${cells}</div></div>`;
}

// ---------- render ----------
function status(s) {
  const climbing = (s.kpis.views24h || 0) > 0;
  if (s.campaign.status === 'live') return { chip: 'Campaign live', on: true };
  if (s.campaign.status === 'budget_complete') return { chip: climbing ? 'Budget complete, views still climbing' : 'Budget complete', on: climbing };
  if (s.campaign.status === 'paused') return { chip: climbing ? 'Paused, views still climbing' : 'Paused', on: climbing };
  return { chip: 'Campaign wrapped', on: false };
}
// the newest clip, only while it's news
const fresh = c => c && Date.now() - Date.parse(c.at) < 2 * DAY ? c : null;
const count = (key, v) => `<span data-count="${Math.floor(v)}" data-key="${key}">${commas(NUMS[key] ?? 0)}</span>`;
const info = t => `<span class="info" tabindex="0" title="${esc(t)}" aria-label="${esc(t)}">${SVG.info}</span>`;
const stat = (key, label, value, unit, sub, viz = '', tip = '') => `<div class="stat k-${key}">
  <h3>${esc(label)}${tip ? info(tip) : ''}</h3>
  <p class="v">${typeof value === 'number' ? count(key, value) : esc(value)}<small>${esc(unit)}</small></p>

// The four numbers under the hero. Each shows the live side of its number: the hour still running, the newest clips.
function stats(s) {
  const k = s.kpis, out = [];
  const p48 = (s.pulse || []).slice(-48).map(x => x.g || 0);
  if (k.views24h != null) {
    out.push(stat('vph', 'Views per hour', k.views24h / 24, '/hr', 'Average over the last 24 hours',
      p48.some(v => v > 0) ? sparkBars(p48, 32, true) : '', 'Views added across the campaign each hour. The bars are the last 48 hours, and the violet one is the hour still running.'));
  } else {
    // no 24-hour figure yet: the daily average since launch, with a bar for each day
    // (the curve's first day holds everything from before tracking began, so it's left out)
    const days = (s.curve || []).slice(1).slice(-30).map(d => d.gained);
    out.push(stat('vpd', 'Views per day', k.totalViews / Math.max(1, s.campaign.day || 1), '/day', `Average over ${commas(s.campaign.day || 1)} days`,
      days.length > 2 ? sparkBars(days, 32, true) : '', 'Views added across the campaign each day since launch. The violet bar is today so far.'));
  }
  const vf = k.verifiedViews / (k.totalViews || 1);
  out.push(stat('ver', 'Verified views', k.verifiedViews, '',
    `${pct(vf)}% of all views${k.verified24h ? `<span class="up">${SVG.up}+${commas(k.verified24h)} in the last 24 hours</span>` : ''}`,
    meter(vf, true), 'Views on clips reviewed and approved for authentic engagement.'));
  let viz = '';
  const P = k.engagementParts;
  if (P) {
    const saves = /saves/.test(k.engagementBasis || '');
    const parts = [['Likes', P.likes, 'var(--violet)'], ['Comments', P.comments, 'var(--lilac)'],
      [saves ? 'Shares & saves' : 'Shares', P.sharesSaves, 'var(--lens)']].filter(p => p[1] > 0);
    const sum = parts.reduce((a, p) => a + p[1], 0) || 1;
    viz = `<div class="stack">${parts.map(p => `<i style="width:${(100 * p[1] / sum).toFixed(1)}%;background:${p[2]}" title="${p[0]}"></i>`).join('')}</div>
      <div class="keys">${parts.map(p => `<span><i style="background:${p[2]}"></i>${p[0]}<b>${pctFine(p[1])}%</b></span>`).join('')}</div>`;
  }
  out.push(stat('eng', 'Engagement rate', k.engagement == null ? '–' : pct(k.engagement), '%', esc(cap(k.engagementBasis)), viz,
    'Across verified clips. Shares and saves come from creators’ Instagram Insights.'));
  const perDay = (s.clipsPerDay || []).map(x => x.n), newest = fresh(s.latest?.[0]);
  out.push(stat('clips', 'Clips posted', k.clips, '',
    `By ${commas(k.creators)} creators${newest ? ` · newest <span data-ago="${esc(newest.at)}">${ago(newest.at)}</span>` : k.clips24h ? ` · ${commas(k.clips24h)} today` : ''}`,
    strip(s.latest) || (perDay.length > 2 ? sparkBars(perDay) : ''), 'Clips live in the campaign. The strip shows the newest ones.'));
  return out.join('');
}

// Real facts that take turns in the chip under the total.
function facts(s) {
  const k = s.kpis, A = s.audience?.markets?.[0], out = [];
  if (k.views24h) out.push(`${SVG.up}+${commas(k.views24h)} views in the last 24 hours`);
  const nw = fresh(s.latest?.[0]);
  if (nw) out.push(`<i></i>Newest clip posted <span data-ago="${esc(nw.at)}">${ago(nw.at)}</span>`);
  if (A) out.push(`<i></i>${Math.round(A.pct)}% of viewers are in ${esc(the(A.name))}`);
  if (s.top?.[0]) out.push(`<i></i>Top clip at ${esc(short(s.top[0].v))} views`);
  if (k.clips24h) out.push(`<i></i>${commas(k.clips24h)} new clips in the last 24 hours`);
  if (k.engagement != null) out.push(`<i></i>${pct(k.engagement)}% engagement on verified clips`);
  return out;
}
// one line at a time, sliding up, with the chip fitting itself to each line; the step is read from the layout so it
// can't drift
function ticker() {
  clearInterval(TICK_T);
  const tk = document.getElementById('tk');
  if (!tk || tk.children.length < 2 || REDUCED) return;
  const n = tk.children.length, chip = tk.parentElement;
  const pad = parseFloat(getComputedStyle(chip).paddingLeft) * 2;
  const fit = j => { chip.style.width = Math.ceil(tk.children[j].offsetWidth + pad) + 'px'; };
  tk.appendChild(tk.children[0].cloneNode(true));   // slide onto a copy of the first, then snap back to it
  let i = 0;
  fit(0);
  document.fonts?.ready.then(() => { if (tk.isConnected) fit(i); });
  TICK_T = setInterval(() => {
    if (document.hidden || !tk.isConnected) return;
    const step = tk.children[0].offsetHeight;
    i++;
    tk.style.transition = ''; tk.style.transform = `translateY(${-i * step}px)`;
    fit(i);
    if (i === n) setTimeout(() => { tk.style.transition = 'none'; tk.style.transform = 'none'; i = 0; }, 750);
  }, 3800);
}

// The board pairs panels side by side when their widths make a full row; a panel without a partner takes the row.
function board(s) {
  const RX = s.reactions;
  const items = [
    { w: 8, html: cls => `<section class="panel ${cls}">
      <div class="ph"><div><h2>Views over time</h2><p class="note">Every clip still in the campaign</p></div>
        <div class="seg" role="group" aria-label="Chart view">

        </div></div>

    s.milestones?.hit?.length && { w: 4, html: cls => `<section class="panel ${cls}">${milestones(s)}</section>` },
    s.pulse?.length && { w: 7, html: cls => `<section class="panel ${cls}">${heat(s)}</section>` },

// Reactions are ranked categories from one comment read, so they step down one ramp from the mark's lens into lilac;

function reactions(r, cls) {
  const rows = r.rows || [], lead = rows[0];

    <div class="ph"><div><h2>How fans reacted</h2><p class="note">Read from the comments${r.asOf ? `, ${esc(dayLocal(r.asOf + 'T12:00:00'))}` : ''}</p></div></div>
    <div class="rx-in"><div>
      ${lead ? `<p class="headline"><b>${lead.pct}%</b>of comments: ${esc(lead.label[0].toLowerCase() + lead.label.slice(1))} ${esc(lead.emoji || '')}</p>` : ''}
      <div class="spec">${rows.map((x, i) => `<i style="width:${x.pct}%;background:${col(x, i)}" title="${esc(x.label)}: ${x.pct}%"></i>`).join('')}</div></div>
      <ul class="rx">${rows.map((x, i) => `<li><i style="background:${col(x, i)}"></i><span>${esc(x.label)} ${esc(x.emoji || '')}</span><b>${x.pct}%</b></li>`).join('')}</ul>
    </div></section>`;
}

// Round-number milestones: how close the next one is, the pace to it, and when each one landed.
function milestones(s) {
  const M = s.milestones;
  if (!M?.hit?.length) return '';
  const k = s.kpis, launch = Date.parse(s.campaign.launch);
  const last = M.hit.at(-1).v, next = last + M.step;
  const frac = Math.max(0, Math.min(1, (k.totalViews - last) / M.step)), toGo = Math.max(0, next - k.totalViews);
  const known = (s.pulse || []).filter(x => x.g != null);
  const perDay = known.length >= 24 ? known.reduce((a, x) => a + x.g, 0) / known.length * 24 : 0;
  const days = perDay > 0 ? toGo / perDay : Infinity;
  const eta = days <= 90 ? dayLocal(new Date(Date.now() + days * DAY).toISOString()) : null;
  const dayN = t => Math.floor((Date.parse(t) - launch) / DAY) + 1;
  const shown = M.hit.length > 5 ? [...M.hit.slice(-4).reverse(), M.hit[0]] : [...M.hit].reverse();
  return `<div class="ph"><div><h2>Milestones</h2><p class="note">Every ${axisNum(M.step)} views, and the day it landed</p></div></div>
    <div class="nx">
      <p class="nx-l">Next milestone</p>
      <div class="nx-r"><span class="nx-v">${axisNum(next)}</span><span class="nx-p"><b>${Math.floor(frac * 100)}%</b> of the way there</span></div>
      ${meter(frac, true)}
      <div class="nx-x"><span>${axisNum(last)}</span><span>${axisNum(next)}</span></div>
      <p class="nx-s"><b>${commas(toGo)}</b> views to go${eta ? `. Around ${esc(eta)} at this week’s pace.` : '.'}</p>
    </div>
    <ol class="tl">${shown.map((h, i) => `<li${M.hit.length > 5 && i === 4 ? ' class="gap"' : ''}><b>${axisNum(h.v)}</b><span>${esc(dayLocal(h.t))}</span><span>Day ${dayN(h.t)}</span></li>`).join('')}</ol>`;
}

// When views come in: the last seven days of hourly gains, one row per local day, on one ramp from mist to the lens.
const HEAT = ['#efe8fb', '#e0d2f6', '#cdb6f0', '#b898e8', '#a07bdf', '#875fd5', '#7047cf', '#5734a8', '#402087'];
const heatColor = (v, max) => v > 0 ? HEAT[Math.min(HEAT.length - 1, Math.max(0, Math.ceil(Math.sqrt(v / max) * (HEAT.length - 1))))] : 'rgba(14,12,21,.05)';
function heat(s) {
  const P = s.pulse;
  if (!P?.length) return '';
  const days = new Map();
  P.forEach((x, i) => {
    const d = new Date(x.t), key = d.toDateString();
    if (!days.has(key)) days.set(key, { d, c: Array(24).fill(-1) });
    days.get(key).c[d.getHours()] = i;
  });
  const rows = [...days.values()].slice(-7);
  const max = Math.max(1, ...P.map(x => x.g || 0));
  const pk = P.reduce((b, x, i) => (x.g || 0) > (P[b].g || 0) ? i : b, 0), peak = P[pk], end = P.length - 1;
  const cell = i => {
    if (i < 0 || P[i].g == null) return '<i class="na"></i>';
    const cls = [i === pk && 'pk', i === end && 'now'].filter(Boolean).join(' ');
    return `<i data-i="${i}" style="background:${heatColor(P[i].g, max)}"${cls ? ` class="${cls}"` : ''}></i>`;
  };
  return `<div class="ph"><div><h2>When views come in</h2><p class="note">Views gained each hour over the last 7 days, in your time zone</p></div></div>
    ${peak.g ? `<p class="headline"><b>+${commas(peak.g)}</b>views in the busiest hour, ${esc(weekday(peak.t))} at ${esc(hourLocal(peak.t))}</p>` : ''}
    <div class="hm" id="hm" role="img" aria-label="Views gained per hour over the last 7 days.${peak.g ? ` Busiest hour: ${esc(weekday(peak.t))} at ${esc(hourLocal(peak.t))}, ${commas(peak.g)} views.` : ''}">
      ${rows.map(r => `<div class="hm-r"><span class="hm-d">${WEEKDAYS[r.d.getDay()]} ${r.d.getDate()}</span>${r.c.map(cell).join('')}</div>`).join('')}
      <div class="hm-r hm-x"><span></span>${[0, 6, 12, 18].map(h => `<span style="grid-column:${h + 2} / span 6">${hour12(h)}</span>`).join('')}</div>
      <div class="tip" id="htip"></div>
    </div>
    <div class="hm-key" aria-hidden="true"><span>Fewer</span>${HEAT.map(c => `<i style="background:${c}"></i>`).join('')}<span>More</span></div>`;
}

function climbing(s) {
  if (!s.rising?.length) return '';
  return `<div class="ph"><div><h2>Still climbing</h2><p class="note">Biggest gains in the last 24 hours</p></div></div>
    <ul class="movers">${s.rising.map(r => {
      const href = safeUrl(r.url, 'post'), th = safeUrl(r.th);
      return `<li><a class="mv" ${href ? `href="${esc(href)}" target="_blank" rel="noopener"` : ''}>
        ${th ? `<img src="${esc(th)}" alt="" loading="lazy">` : '<span class="ph0"></span>'}
        <span><span class="g">${SVG.up}+${esc(short(r.gain))}</span><span class="s">${esc(r.title)}</span>${sparkLine(r.spark || [])}</span></a></li>`;
    }).join('')}</ul>`;
}

function wall(items) {
  return `<div class="wall">${items.map(w => {
    const href = safeUrl(w.url, 'post'), th = safeUrl(w.th);
    return `<a class="tile${th ? '' : ' noimg'}" ${href ? `href="${esc(href)}" target="_blank" rel="noopener"` : ''} title="${esc(w.title)}" aria-label="${esc(w.title)}, ${esc(short(w.v))} views">
      ${th ? `<img src="${esc(th)}" alt="" loading="lazy">` : ''}<span>${PLAY}${esc(short(w.v))}</span></a>`;
  }).join('')}</div>`;
}

// ---------- motion ----------
// Every counting number rolls from wherever it last stood: from zero on the first open, by the gain on an update.
function rollNums() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const key = el.dataset.key, to = +el.dataset.count, from = NUMS[key] ?? 0;
    NUMS[key] = to;
    if (REDUCED || from === to) { el.textContent = commas(to); return; }
    const t0 = performance.now(), dur = from ? 1400 : 2100;
    const f = now => {
      if (!el.isConnected) return;
      const q = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - q, 4);
      el.textContent = commas(Math.floor(from + (to - from) * e));
      if (q < 1) requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  });
}

// The live pill: a ring that fills toward the next 15-minute update, the countdown to it, and the polling. Past due
// (GitHub's scheduler sometimes runs late) it checks every 20 seconds; after 40 minutes it reads "Delayed".
function tick(force) {
  const s = SNAP;
  if (!s) return;
  const now = Date.now(), age = now - Date.parse(s.generatedAt), left = SYNC_EVERY - age, stale = age > STALE_AFTER;
  const prg = document.getElementById('prg'), next = document.getElementById('next');
  prg?.style.setProperty('stroke-dashoffset', String(50.3 * (1 - Math.min(1, age / SYNC_EVERY))));
  document.getElementById('sync')?.classList.toggle('stale', stale);
  const lab = document.getElementById('sync-l');
  if (lab) lab.textContent = stale ? 'Delayed' : 'Live';
  if (next) next.textContent = left > 0 ? `in ${Math.max(1, Math.ceil(left / 60e3))} min` : stale ? 'soon' : 'any minute';
  if (force || now - AGO_AT > 10e3) {
    AGO_AT = now;
    document.querySelectorAll('[data-ago]').forEach(el => { el.textContent = ago(el.dataset.ago); });
  }
  if (!force && now >= NEXT_CHECK) { NEXT_CHECK = now + (left > 0 ? 60e3 : 20e3); refresh(); }
}
// the bar picks up a hairline once the page scrolls, and the name once the hero's own name has gone under it
function barState() {
  const bar = document.getElementById('bar'), name = document.querySelector('#hero .name');
  if (!bar) return;
  bar.classList.toggle('scrolled', scrollY > 8);
  bar.classList.toggle('past', !!name && name.getBoundingClientRect().bottom < bar.getBoundingClientRect().bottom);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3200);
}

function wire(s) {
  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
    if (MODE === b.dataset.mode) return;
    MODE = b.dataset.mode;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    drawChart(true);
  }));
  const rail = document.getElementById('rail'), navs = document.getElementById('navs');
  if (rail && navs) {
    const upd = () => {
      const over = rail.scrollWidth > rail.clientWidth + 4;
      navs.hidden = !over;
      navs.children[0].disabled = rail.scrollLeft < 4;
      navs.children[1].disabled = rail.scrollLeft + rail.clientWidth >= rail.scrollWidth - 4;
    };
    navs.addEventListener('click', e => { const b = e.target.closest('button'); if (b) rail.scrollBy({ left: +b.dataset.dir * rail.clientWidth * .8, behavior: REDUCED ? 'auto' : 'smooth' }); });
    rail.addEventListener('scroll', upd, { passive: true });
    new ResizeObserver(upd).observe(rail);
  }
  // heatmap cells
  const hm = document.getElementById('hm'), htip = document.getElementById('htip');
  if (hm && htip) {
    const P = s.pulse;
    const showCell = e => {
      const c = e.target.closest?.('i[data-i]');
      if (!c) { htip.style.opacity = 0; return; }
      const i = +c.dataset.i, x = P[i], r = c.getBoundingClientRect(), h = hm.getBoundingClientRect();
      htip.innerHTML = `${esc(weekday(x.t))}, ${hourLocal(x.t)}–${hourLocal(new Date(Date.parse(x.t) + HOUR).toISOString())}<b>+${commas(x.g)}</b>${i === P.length - 1 ? 'this hour so far' : 'views that hour'}`;
      htip.style.left = Math.max(100, Math.min(h.width - 100, r.left - h.left + r.width / 2)) + 'px';
      htip.style.top = (r.top - h.top) + 'px';
      htip.style.opacity = 1;
    };
    hm.addEventListener('pointermove', showCell);
    hm.addEventListener('pointerdown', showCell);
    hm.addEventListener('pointerleave', () => { htip.style.opacity = 0; });
  }
  document.getElementById('a-share')?.addEventListener('click', async () => {
    const url = location.href.split('#')[0];
    try {
      if (navigator.share) await navigator.share({ title: document.title, url });
      else { await navigator.clipboard.writeText(url); toast('Link copied. Send the password separately.'); }
    } catch {}
  });
  document.getElementById('a-tv')?.addEventListener('click', bigScreen);
  document.getElementById('a-install')?.addEventListener('click', async () => {
    if (!INSTALL) return;
    INSTALL.prompt(); await INSTALL.userChoice.catch(() => {}); INSTALL = null;
    document.getElementById('a-install').hidden = true;
  });
  document.getElementById('a-lock')?.addEventListener('click', () => { store.clear(); location.reload(); });
}

// Big screen: full screen, and keep the display awake while it is up (for a TV in the office or a meeting room).
async function bigScreen() {
  if (document.fullscreenElement) { await document.exitFullscreen().catch(() => {}); return; }
  await document.documentElement.requestFullscreen().catch(() => {});
  if (!document.fullscreenElement) return;
  document.body.classList.add('tv');
  try { WAKE = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) { document.body.classList.remove('tv'); WAKE?.release().catch(() => {}); WAKE = null; }
});

// ---------- chart: one series, one axis; crosshair + tooltip; on the total, a marker where each milestone landed ----------
function niceStep(raw) {
  const p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}
function drawChart(animate) {
  const host = document.getElementById('chart');
  if (!host || !SNAP) return;
  host.querySelector('svg')?.remove();
  const tip = document.getElementById('tip');
  tip.style.opacity = 0;
  const pulse = MODE === 'pulse' && SNAP.pulse ? SNAP.pulse.slice(-48) : null;
  const days = SNAP.curve || [];
  const items = pulse ? pulse.map(x => ({ v: x.g || 0, t: x.t, na: x.g == null })) : days.map(d => ({ v: MODE === 'daily' ? d.gained : d.total, d }));
  if (!items.length) return;
  const bars = MODE !== 'total';
  const W = host.clientWidth, H = host.clientHeight;
  if (!W || !H) return;
  const m = { l: 50, r: 16, t: 22, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const vals = items.map(i => i.v), vmax = Math.max(...vals, 1);
  const step = niceStep(vmax / 5), ymax = Math.ceil(vmax / step) * step;
  const n = items.length, bw = iw / n;
  const x = i => bars ? m.l + bw * i + bw / 2 : m.l + (n === 1 ? iw / 2 : (iw * i) / (n - 1));
  const y = v => m.t + ih - (ih * v) / ymax;
  let grid = '', ax = '';
  for (let v = 0; v <= ymax + step / 2; v += step) {
    grid += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    ax += `<text x="${m.l - 12}" y="${y(v) + 4}" text-anchor="end">${axisNum(v)}</text>`;
  }
  if (pulse) {
    items.forEach((it, i) => {
      const h = new Date(it.t).getHours();
      if (h % 6 === 0 && x(i) > m.l + 14 && x(i) < W - m.r - 14)
        ax += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${h === 0 ? WEEKDAYS[new Date(it.t).getDay()] : hour12(h)}</text>`;
    });
  } else {
    const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 76))));
    days.forEach((d, i) => { if (i % every === 0 || (i === n - 1 && (n - 1) % every > every / 2))
      ax += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${day(d.d + 'T12:00:00Z')}</text>`; });
  }
  let marks = '';
  const defs = `<defs><linearGradient id="cfill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#7047cf" stop-opacity=".2"/><stop offset="1" stop-color="#7047cf" stop-opacity="0"/></linearGradient></defs>`;
  if (bars) {
    // thin marks; the last bar is the hour or day still running, in the lighter lilac
    const w = Math.max(2, Math.min(bw * (pulse ? .7 : .58), pulse ? 16 : 30));
    marks = `<g class="bars">${items.map((it, i) => {
      const h = Math.max(0, (ih * it.v) / ymax), top = m.t + ih - h, r = Math.min(4, w / 2, h);
      return `<path data-i="${i}" d="M${x(i) - w / 2},${m.t + ih}V${top + r}q0,-${r} ${r},-${r}H${x(i) + w / 2 - r}q${r},0 ${r},${r}V${m.t + ih}Z" fill="var(${i === n - 1 ? '--lilac' : '--violet'})"/>`;
    }).join('')}</g>`;
  } else {
    const pts = items.map((it, i) => [x(i), y(it.v)]);
    const line = smooth(pts), ex = x(n - 1), ey = y(vals[n - 1]);
    marks = `<path class="${animate ? 'fadein' : ''}" d="${line}L${ex},${m.t + ih}L${x(0)},${m.t + ih}Z" fill="url(#cfill)"/>
      <path id="cl" class="${animate ? 'draw' : ''}" pathLength="1" d="${line}" fill="none" stroke="var(--violet)" stroke-width="2.2" stroke-linecap="round"/>
      <g class="ms${animate ? ' fadein late' : ''}" id="ms"></g>
      <g class="${animate ? 'fadein late' : ''}"><circle class="ping" cx="${ex}" cy="${ey}" r="4.5" fill="none" stroke="var(--violet)" stroke-width="1.5"/>
      <circle cx="${ex}" cy="${ey}" r="4.5" fill="var(--violet)" stroke="#fff" stroke-width="2"/></g>`;
  }
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', pulse ? 'Views gained per hour, last 48 hours' : MODE === 'daily' ? 'Views gained per day' : 'Total views over time');
  svg.innerHTML = `${defs}<g class="grid">${grid}</g>${marks}<g class="axis">${ax}</g>
    <line id="xh" y1="${m.t}" y2="${m.t + ih}" stroke="rgba(14,12,21,.25)" stroke-dasharray="3 3" opacity="0"/>
    <circle id="xd" r="5" fill="var(--violet)" stroke="#fff" stroke-width="2" opacity="0"/>
    <rect x="${m.l}" y="0" width="${iw}" height="${H}" fill="transparent"/>`;
  host.prepend(svg);
  // milestone markers: where the drawn line crosses each round number (the line only climbs, so bisect along it)
  const ms = svg.querySelector('#ms');
  if (ms && SNAP.milestones?.hit?.length) {
    // measured on a bare copy of the line, since pathLength (for the draw-in) would rescale the lengths
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', svg.querySelector('#cl').getAttribute('d')); path.setAttribute('fill', 'none');
    svg.appendChild(path);
    const L = path.getTotalLength();
    let out = '', lastX = -1e9;
    for (const h of SNAP.milestones.hit) {
      if (h.v > ymax || h.v > vals[n - 1]) continue;
      const ty = y(h.v);
      let lo = 0, hi = L;
      for (let it = 0; it < 24; it++) { const mid = (lo + hi) / 2; if (path.getPointAtLength(mid).y > ty) lo = mid; else hi = mid; }
      const p = path.getPointAtLength(hi), label = p.x - lastX > 78 && p.x > m.l + 40;
      out += `<line x1="${p.x}" x2="${p.x}" y1="${p.y + 7}" y2="${m.t + ih}" stroke="rgba(14,12,21,.12)" stroke-dasharray="2 3"/>
        <circle cx="${p.x}" cy="${p.y}" r="3.6" fill="#fff" stroke="var(--violet)" stroke-width="1.5"/>`;
      if (label) { out += `<text x="${p.x - 9}" y="${p.y - 9}" text-anchor="end">${axisNum(h.v)} · ${dayLocal(h.t)}</text>`; lastX = p.x; }
    }
    path.remove();
    ms.innerHTML = out;
  }
  const xh = svg.querySelector('#xh'), xd = svg.querySelector('#xd'), barEls = [...svg.querySelectorAll('.bars path')];
  const show = ev => {
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(n - 1, bars ? Math.floor((px - m.l) / bw) : Math.round(((px - m.l) / iw) * (n - 1))));
    const it = items[i], last = i === n - 1;
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('opacity', bars ? 0 : 1);
    xd.setAttribute('cx', x(i)); xd.setAttribute('cy', y(it.v)); xd.setAttribute('opacity', bars ? 0 : 1);
    barEls.forEach((b, j) => b.style.opacity = j === i ? 1 : .35);
    if (pulse) {
      const e = new Date(Date.parse(it.t) + HOUR).toISOString();
      tip.innerHTML = `${dayLocal(it.t)}, ${hourLocal(it.t)}–${hourLocal(e)}${it.na ? '<b>–</b>no reading that hour' : `<b>+${commas(it.v)}</b>${last ? 'this hour so far' : 'views that hour'}`}`;
    } else if (MODE === 'daily') {
      tip.innerHTML = `${day(it.d.d + 'T12:00:00Z')}${last ? ' (so far)' : ''}<b>+${commas(it.v)}</b>views that day`;
    } else {
      tip.innerHTML = `${last ? 'Now' : 'End of ' + day(it.d.d + 'T12:00:00Z')}<b>${commas(it.v)}</b>${it.d.gained ? '+' + commas(it.d.gained) + ' that day' : 'total views'}`;
    }
    const tx = Math.max(80, Math.min(W - 80, x(i)));
    tip.style.left = (tx / W) * 100 + '%';
    tip.style.top = (bars ? Math.max(y(it.v), m.t + 40) : y(it.v)) / H * 100 + '%';
    tip.style.opacity = 1;
  };
  const hide = () => { tip.style.opacity = 0; xh.setAttribute('opacity', 0); xd.setAttribute('opacity', 0); barEls.forEach(b => b.style.opacity = ''); };
  svg.addEventListener('pointermove', show);
  svg.addEventListener('pointerdown', show);
  svg.addEventListener('pointerleave', hide);
}
let resizeT = 0, lastW = innerWidth;
addEventListener('resize', () => {
  // phones fire resize when the address bar slides; only a real width change redraws
  if (innerWidth === lastW) return;
  lastW = innerWidth;
  clearTimeout(resizeT); resizeT = setTimeout(() => drawChart(false), 120);
});

// ---------- the Earth: a dotted globe drawn in WebGL from assets/earth.json. Every dot knows its country, so a market
// lights up as the whole country, not a pin. It roams on its own: it drifts and sways, tours the markets and keeps
// turning while it holds on one, and ripples keep spreading out across each market from its middle. ----------
const EARTH_VERT = `attribute vec3 aP;attribute float aK;attribute float aW;attribute vec3 aC;
uniform mat3 uR;uniform vec2 uS;uniform float uRad;uniform float uDot;uniform float uF;uniform float uT;uniform float uG;
varying vec4 vC;varying float vG;
void main(){
  vec3 p=uR*aP;vG=uG;
  float mk=step(.5,aK),foc=mk*(1.-step(.5,abs(aK-uF)));
  // the far side, and (in the glow pass) everything that isn't a market, is dropped outside the clip space
  if(p.z<-.02||(uG>.5&&mk<.5)){gl_Position=vec4(2.,2.,2.,1.);gl_PointSize=1.;vC=vec4(0.);return;}
  float face=smoothstep(-.02,.3,p.z);
  float ang=acos(clamp(dot(aP,aC),-1.,1.));
  float wave=mk*pow(1.-fract(uT*.42-ang*2.6),7.)*(.4+.6*foc);
  gl_Position=vec4(p.xy*(2.*uRad/uS),0.,1.);
  vec3 land=vec3(.62,.6,.7),lilac=vec3(.69,.53,.91),violet=vec3(.44,.28,.81),lens=vec3(.25,.13,.53);
  if(uG>.5){
    // the wash under a market: big soft points that run together into the country's shape
    gl_PointSize=face*uDot*(4.5+1.5*foc);
    vC=vec4(lilac,(.07+.06*foc+.07*wave)*face);
  }else{
    gl_PointSize=uDot*(.6+.4*p.z)*(1.+.2*mk+.2*foc+.35*wave);
    vec3 c=mix(land,mix(lilac,violet,.45+.55*aW),mk);
    c=mix(c,lens,mk*(.2*foc+.4*wave));
    float a=mix(.32+.4*p.z,.8+.2*p.z,mk);
    vC=vec4(c,min(1.,a)*face);
  }
}`;
const EARTH_FRAG = `precision mediump float;varying vec4 vC;varying float vG;
void main(){float r=length(gl_PointCoord-.5);
  float a=vG>.5?exp(-r*r*12.)*(1.-smoothstep(.42,.5,r)):1.-smoothstep(.3,.5,r);
  gl_FragColor=vec4(vC.rgb,1.)*vC.a*a;}`;

let EARTH = null;   // the map, fetched once
function earthData() {
  EARTH ||= fetch('../assets/earth.json').then(r => { if (!r.ok) throw new Error('earth ' + r.status); return r.json(); }).then(j => {
    const cells = unb64(j.cells), n = j.n, GA = Math.PI * (3 - Math.sqrt(5)), pts = [], ids = [];
    // the same lattice tools/earth.mjs tagged
    for (let i = 0; i < n; i++) if (cells[i]) {
      const y = 1 - (2 * i + 1) / n, r = Math.sqrt(1 - y * y), th = i * GA;
      pts.push(r * Math.sin(th), y, r * Math.cos(th)); ids.push(cells[i]);
    }
    return { n, pts: new Float32Array(pts), ids: Uint8Array.from(ids), codes: j.codes, centers: j.centers };
  }).catch(e => { EARTH = null; throw e; });
  return EARTH;
}

const DEG = Math.PI / 180, TAU = Math.PI * 2;
const toVec = ([lat, lon]) => [Math.cos(lat * DEG) * Math.sin(lon * DEG), Math.sin(lat * DEG), Math.cos(lat * DEG) * Math.cos(lon * DEG)];
const wrapPi = a => ((a % TAU) + TAU + Math.PI) % TAU - Math.PI;
const clampLat = v => Math.max(-48 * DEG, Math.min(56 * DEG, v));
// rows of the rotation that brings (lat, lon) to the middle of the disc
function viewRows(lat, lon) {
  const ca = Math.cos(lat), sa = Math.sin(lat), cb = Math.cos(lon), sb = -Math.sin(lon);
  return [[cb, 0, sb], [sa * sb, ca, -sa * cb], [-ca * sb, sa, ca * cb]];
}

async function mountGlobe(a, first) {
  const cv = document.getElementById('globe');
  if (!cv) return;
  // without the map (or WebGL) the Earth steps aside and the market list stands on its own
  const flat = () => { cv.closest('.globe')?.remove(); document.getElementById('stage')?.classList.add('flat'); };
  let E;
  try { E = await earthData(); } catch { if (cv.isConnected) flat(); return; }
  if (!cv.isConnected) return;
  const gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false, powerPreference: 'low-power' });
  if (!gl) { flat(); return; }
  let prog;
  try {
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, EARTH_VERT)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, EARTH_FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
  } catch { flat(); return; }

  // the markets, ranked, and what each dot needs to know about its country
  const iso = c => c === 'UK' ? 'GB' : c;
  const stops = a.markets.map((m, i) => {
    const k = E.codes.indexOf(iso(m.cc)) + 1, at = E.centers[iso(m.cc)];
    return k && at ? { m, i, k, at, v: toVec(at) } : null;
  }).filter(Boolean);
  const lead = Math.max(1, ...stops.map(s => s.m.pct));
  const byK = new Map(stops.map((s, r) => [s.k, { r: r + 1, w: s.m.pct / lead, v: s.v }]));
  const n = E.ids.length, K = new Float32Array(n), W = new Float32Array(n), C = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const s = byK.get(E.ids[i]); if (s) { K[i] = s.r; W[i] = s.w; C.set(s.v, i * 3); } }
  const attr = (name, data, size) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, name); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, 0, 0);
  };
  attr('aP', E.pts, 3); attr('aK', K, 1); attr('aW', W, 1); attr('aC', C, 3);
  const u = Object.fromEntries(['uR', 'uS', 'uRad', 'uDot', 'uF', 'uT', 'uG'].map(k => [k, gl.getUniformLocation(prog, k)]));
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);   // premultiplied, so the wash and the dots lay over the white like paint

  const focus = document.getElementById('focus'), lab = document.getElementById('focus-l');
  const btns = [...document.querySelectorAll('#mk button')];
  // a market the map can't place still reads in the list, it just can't turn the globe
  btns.forEach(b => { if (!stops.some(x => x.i === +b.dataset.m)) { b.disabled = true; b.setAttribute('aria-pressed', 'false'); } });
  const dpr = Math.min(devicePixelRatio || 1, 2), t0 = performance.now();
  const home = stops[0]?.at || [24, -40];
  let tLon = home[1] * DEG, tLat = clampLat(home[0] * DEG), cur = 0;
  let lon, lat;
  if (CAM.lon != null) { lon = CAM.lon; lat = CAM.lat; tLon = lon; tLat = clampLat(lat); }
  // on the first open the Earth swings round to the biggest market
  else { lon = tLon - (first && !REDUCED ? 1.4 : 0); lat = first && !REDUCED ? tLat * .2 : tLat; }
  let vLon = 0, vLat = 0, drag = null, last = t0, raf = 0, vis = true, dead = false, cw = 0, shown = null;

  const go = (k, hold = 0) => {
    const s = stops[k];
    if (!s) return;
    cur = k;
    // aim a little behind the market, so the drift carries it across the middle while the tour holds on it
    tLon = lon + wrapPi(s.at[1] * DEG - (REDUCED ? 0 : 6 * DEG) - lon);
    tLat = clampLat(s.at[0] * DEG);
    if (REDUCED) { lon = tLon; lat = tLat; }
    lab.innerHTML = `<b>${Math.round(s.m.pct)}%</b>${esc(s.m.name)}`;
    btns.forEach(b => { if (!b.disabled) b.setAttribute('aria-pressed', String(+b.dataset.m === s.i)); });
    TOUR.hold = Date.now() + hold;
    if (REDUCED) frame(performance.now());
  };

  function frame(now) {
    const dt = Math.min(.05, Math.max(0, now - last) / 1000), t = (now - t0) / 1000;
    last = now;
    if (!drag && !REDUCED) {
      tLon += (stops.length ? 1.3 : 4) * DEG * dt;          // it never stops turning
      tLon += vLon * dt; tLat = clampLat(tLat + vLat * dt);   // a flick keeps going for a moment
      vLon *= Math.exp(-dt * 2.4); vLat *= Math.exp(-dt * 2.4);
      const e = 1 - Math.exp(-dt * 1.5);
      lon += (tLon - lon) * e;
      lat += (tLat + 3 * DEG * Math.sin(t * .31) - lat) * e;  // and sways a little
    }
    CAM.lon = lon; CAM.lat = lat;
    const w = cv.clientWidth;
    if (!w) return;
    if (w !== cw) { cw = w; cv.width = cv.height = Math.round(w * dpr); gl.viewport(0, 0, cv.width, cv.height); }
    const R = viewRows(lat, lon), rad = cv.width * .42;
    gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniformMatrix3fv(u.uR, false, [R[0][0], R[1][0], R[2][0], R[0][1], R[1][1], R[2][1], R[0][2], R[1][2], R[2][2]]);
    gl.uniform2f(u.uS, cv.width, cv.height); gl.uniform1f(u.uRad, rad);
    gl.uniform1f(u.uDot, Math.max(1.6 * dpr, Math.sqrt(4 * Math.PI / E.n) * rad * .62));
    gl.uniform1f(u.uF, stops.length ? cur + 1 : 0); gl.uniform1f(u.uT, REDUCED ? 0 : t);
    gl.uniform1f(u.uG, 1); gl.drawArrays(gl.POINTS, 0, n);
    gl.uniform1f(u.uG, 0); gl.drawArrays(gl.POINTS, 0, n);
    // the label rides on the focused market's middle while it faces us
    const s = stops[cur];
    if (s) {
      const [x, y, z] = R.map(r => r[0] * s.v[0] + r[1] * s.v[1] + r[2] * s.v[2]), px = w / 2 + x * w * .42, py = w / 2 - y * w * .42;
      focus.style.transform = `translate(${px.toFixed(1)}px, ${py.toFixed(1)}px)`;
      if ((z > .5) !== shown) { shown = z > .5; focus.classList.toggle('on', shown); }
    }
  }
  const loop = now => { raf = 0; if (dead || !vis) return; frame(now); raf = requestAnimationFrame(loop); };
  const kick = () => { if (!REDUCED && !raf && vis && !dead) { last = performance.now(); raf = requestAnimationFrame(loop); } };

  // drag to turn it; the tour waits a few seconds after you let go
  let mv = null;
  cv.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    drag = { x: e.clientX, y: e.clientY, lon, lat }; mv = { t: performance.now(), lon, lat }; vLon = vLat = 0;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!drag) return;
    const r = cv.clientWidth * .42, now = performance.now();
    lon = drag.lon - (e.clientX - drag.x) / r;
    lat = Math.max(-70 * DEG, Math.min(70 * DEG, drag.lat + (e.clientY - drag.y) / r));
    const dt = (now - mv.t) / 1000;
    if (dt > .008) { vLon = (lon - mv.lon) / dt; vLat = (lat - mv.lat) / dt; mv = { t: now, lon, lat }; }
    tLon = lon; tLat = clampLat(lat);
    if (REDUCED) frame(now);
  });
  const end = () => {
    if (!drag) return;
    drag = null; TOUR.hold = Date.now() + 8000;
    if (performance.now() - mv.t > 90) vLon = vLat = 0;   // held still before letting go: no flick
    vLon = Math.max(-4, Math.min(4, vLon)); vLat = Math.max(-2, Math.min(2, vLat));
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('lostpointercapture', end);
  btns.forEach(b => b.addEventListener('click', () => {
    const k = stops.findIndex(x => x.i === +b.dataset.m);
    if (k >= 0) go(k, 12000);
  }));
  go(Math.min(CAM.cur ?? 0, Math.max(0, stops.length - 1)));
  if (CAM.lon != null) { tLon = lon + wrapPi(tLon - lon); }
  if (!REDUCED && stops.length > 1) TOUR.timer = setInterval(() => {
    if (drag || Date.now() < TOUR.hold || document.hidden) return;
    go((cur + 1) % stops.length);
    CAM.cur = cur;
  }, 6500);
  // stop drawing while the hero is scrolled away; redraw at the new size when the layout changes
  TOUR.io = new IntersectionObserver(([e]) => { vis = e.isIntersecting; kick(); });
  TOUR.io.observe(cv);
  const ro = new ResizeObserver(() => { if (REDUCED || !raf) frame(performance.now()); });
  ro.observe(cv);
  GLOBE = { destroy() { dead = true; cancelAnimationFrame(raf); ro.disconnect(); CAM.cur = cur; gl.getExtension('WEBGL_lose_context')?.loseContext(); } };
  frame(performance.now()); kick();
  if (CAM.seen) cv.classList.add('on');
  else setTimeout(() => cv.classList.add('on'), 40);
  CAM.seen = true;
}

// ---------- lifecycle ----------
async function show(key, box) {
  const snap = await openBox(key, box);
  if (snap.client?.art && !ART) ART = await fetchArt(key).catch(() => null);
  const before = SNAP?.kpis?.totalViews;
  SNAP = snap; BOX_T = box.t; NEXT_CHECK = Date.now() + 60e3;
  if (snap.audience?.markets?.length) earthData().catch(() => {});
  const gate = document.getElementById('gate'), first = !gate.hidden;
  const swap = () => {
    gate.hidden = true;
    document.getElementById('app').hidden = false;
    render(SNAP);
  };
  first && document.startViewTransition && !REDUCED ? document.startViewTransition(swap) : swap();
  // a fresh update: the numbers roll up and a note says how much came in
  if (before != null && snap.kpis.totalViews > before) toast(`+${commas(snap.kpis.totalViews - before)} views since the last update`);
}

async function refresh() {
  if (!KEY || document.hidden) return;
  try {
    const box = await fetchBox();
    if (box.t !== BOX_T) await show(KEY, box);
  } catch { /* offline or mid-deploy: try again next tick */ }
}

async function boot() {
  if (!DATA) { document.body.innerHTML = '<p style="padding:40px;font:15px system-ui">This dashboard link is incomplete.</p>'; return; }
  if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('../sw.js').catch(() => {});
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL = e; const b = document.getElementById('a-install'); if (b) b.hidden = false; });
  let box;
  try { box = await fetchBox(); } catch { box = null; }
  const saved = store.get();
  if (box && saved) {
    try {
      KEY = await crypto.subtle.importKey('raw', unb64(saved), 'AES-GCM', true, ['decrypt']);
      await show(KEY, box);
    } catch { KEY = null; store.clear(); }
  }
  if (!KEY) {
    const gate = document.getElementById('gate'), form = document.getElementById('gate-form');
    const pw = document.getElementById('pw'), btn = document.getElementById('go'), err = document.getElementById('err');
    gate.hidden = false;
    document.getElementById('app').hidden = true;
    pw.focus();
    pw.addEventListener('input', () => { err.textContent = ''; });
    form.addEventListener('submit', async ev => {
      ev.preventDefault();
      const pass = pw.value.trim();
      if (!pass || btn.disabled) return;
      btn.disabled = true; btn.textContent = 'Opening…'; err.textContent = '';
      try {
        box = box || await fetchBox();
        const key = await deriveKey(pass, box.kdf);
        await show(key, box);
        KEY = key;
        store.set(b64(await crypto.subtle.exportKey('raw', key)), document.getElementById('remember').checked);
      } catch (e) {
        err.textContent = e?.name === 'OperationError' ? 'That password didn’t work. Check it and try again.' : 'Couldn’t load the dashboard. Try again in a minute.';
        btn.disabled = false; btn.textContent = 'Enter';
        pw.select();
      }
    });
  }
  setInterval(tick, 1000);
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return;
    refresh();
    if (document.body.classList.contains('tv') && !WAKE) try { WAKE = await navigator.wakeLock?.request('screen'); } catch {}
  });
  addEventListener('scroll', barState, { passive: true });
}
boot();
</script>
