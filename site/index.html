<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Eclipse Live</title>
<link rel="icon" href="assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@85..100,400..800&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,85..100,600..800&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; }
  html { background: #fff; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center;
    background: #fff; color: #0e0c15; font: 15px/1.55 'Archivo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: rgba(112, 71, 207, .18); }
  .mark { display: block; width: 132px; height: auto; margin: 0 auto 20px; }
  .word { font: 800 22px/1 'Archivo', sans-serif; font-stretch: 88%; letter-spacing: .04em; }
  h1 { margin: 34px 0 8px; font: 800 32px/1.1 'Bricolage Grotesque', sans-serif; letter-spacing: -.035em; }
  p { margin: 0 auto; max-width: 340px; color: #6e6a7c; }
</style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 150 100" aria-hidden="true"><circle cx="50" cy="50" r="48" fill="#7047cf"/><circle cx="100" cy="50" r="48" fill="#b087e7"/><path d="M75 9.02A48 48 0 0 1 75 90.98A48 48 0 0 1 75 9.02Z" fill="#402087"/><path d="M69 37.5v25l21-12.5z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/></svg>
    <div class="word">ECLIPSE</div>
    <h1>Client dashboards</h1>
    <p>Open the link your Eclipse contact sent you. Each campaign has its own private page.</p>
  </main>
</body>
</html>
