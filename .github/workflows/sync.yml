# Every 15 minutes: open Content Rewards with the saved Whop session, rebuild each client's encrypted dashboard
# data, and publish to GitHub Pages. Nothing has to be running anywhere else.
name: sync

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # off the hour, when GitHub's scheduler is least busy
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write    # save the refreshed session to the `state` branch
  pages: write
  id-token: write
  actions: write     # keep this schedule switched on (see the last step)

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest   # comes with Google Chrome installed
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Restore the saved Whop session
        run: git fetch -q --depth=1 origin state && git show FETCH_HEAD:state.enc > .state.enc || echo "No session saved yet. Run npm run login on the Mac."

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Pull Content Rewards and build the dashboards
        env:
          ECLIPSE_KEY: ${{ secrets.ECLIPSE_KEY }}
        run: node src/sync.mjs

      - name: Save the refreshed session
        run: |
          blob=$(git hash-object -w .state.enc)
          tree=$(printf '100644 blob %s\tstate.enc\n' "$blob" | git mktree)
          commit=$(git -c user.name=eclipse-live -c user.email=eclipse-live@users.noreply.github.com commit-tree "$tree" -m 'Whop session (encrypted)')
          git push -q -f origin "$commit:refs/heads/state"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub switches off schedules in public repos after 60 days without activity; re-enabling resets that clock.
      - name: Keep the schedule switched on
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable" >/dev/null || true
